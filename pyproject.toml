[project]
name = "citeleaf"
version = "0.1.0"
description = "Evidence-first Chinese document question answering agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "chromadb==1.5.9",
  "streamlit==1.65.0",
  "sentence-transformers==6.1.0",
  "pypdf==6.20.1",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "torch==2.14.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
